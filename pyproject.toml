[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-autocad"
version = "0.1.0"
description = "Portable-first AutoCAD automation for the DCC Model Context Protocol"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "loonghao", email = "hal.long@outlook.com" }]
keywords = ["autocad", "dwg", "autodesk", "mcp", "dcc", "cad", "automation"]
dependencies = ["dcc-mcp-core>=0.20.36,<1.0.0"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pyyaml>=6.0",
  "ruff>=0.8",
  "tomli>=2.0; python_version < '3.11'",
]
windows = ["pywin32>=306"]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-autocad"
Repository = "https://github.com/dcc-mcp/dcc-mcp-autocad"
Issues = "https://github.com/dcc-mcp/dcc-mcp-autocad/issues"

[project.scripts]
dcc-mcp-autocad = "dcc_mcp_autocad.server:main"
dcc-mcp-autocad-doctor = "dcc_mcp_autocad.install:main"

[project.entry-points."dcc_mcp.adapters"]
autocad = "dcc_mcp_autocad:AutoCadMcpServer"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_autocad"]
artifacts = ["src/dcc_mcp_autocad/skills/**"]

[tool.hatch.build.targets.sdist]
include = [
  "src/dcc_mcp_autocad",
  "tests",
  "README.md",
  "install.md",
  "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
